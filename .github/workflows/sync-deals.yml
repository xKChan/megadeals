name: Sync Deals

# Runs scripts/syncDeals.js on a schedule so the site's Supabase `deals`
# table stays fresh without anyone running it by hand. Reuses the exact
# same Node script as local runs — no separate pipeline to maintain.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions
# -> New repository secret) — same names/values as your local .env.local:
#   KEEPA_API_KEY, AMAZON_AFFILIATE_TAG, LINKTWIN_API_KEY, VITE_SUPABASE_URL,
#   VITE_SUPABASE_SECRET_KEY, AMAZON_CREDENTIAL_ID, AMAZON_CREDENTIAL_SECRET,
#   AMAZON_CREDENTIAL_VERSION, AMAZON_MARKETPLACE
# Without these, syncDeals.js's own requireEnv() check fails fast with a
# clear "Missing required env vars" list in the run log — not a silent
# no-op.
#
# All other env vars the script reads (DISCOVERY_MODE, DEAL_DISCOVERY_LIMIT,
# MIN_DEAL_DISCOUNT_PERCENT, etc.) have safe defaults baked into the code —
# only add them below as repo Variables if you want to override a default
# without touching code.

on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour (UTC) — GitHub may delay a
    # run slightly under load; scheduled workflows also auto-disable after
    # 60 days with zero commits to the repo (a GitHub platform limit, not
    # something this workflow controls) — a push re-enables it.
  workflow_dispatch: {} # adds a manual "Run workflow" button in the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    # Bumped 20 -> 35 (2026-08-22): dedupeAsinsByVariantFamily() fetches
    # each candidate one at a time (a real Keepa rate-limit pause between
    # each), so with the brand allowlist now off and MIN_DEAL_REVIEW_COUNT
    # lowered, a run finding hundreds of raw candidates can genuinely need
    # more than 20 minutes even with nothing going wrong. Pair this with
    # DEAL_DISCOVERY_RAW_POOL below to keep a single run's candidate count
    # (and therefore its wall-clock time) bounded and predictable.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync deals
        run: npm run sync-deals
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          LINKTWIN_API_KEY: ${{ secrets.LINKTWIN_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SECRET_KEY: ${{ secrets.VITE_SUPABASE_SECRET_KEY }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREDENTIAL_VERSION }}
          AMAZON_MARKETPLACE: ${{ secrets.AMAZON_MARKETPLACE }}
          # Optional tuning knobs (added 2026-08-21: previously listed here
          # but commented out, which meant setting any of these as a repo
          # Variable in the GitHub UI did NOTHING — the env line below has to
          # actually reference ${{ vars.X }} for a Variable to reach the
          # script at all. Now wired live. Each one is still safe to leave
          # unset: every var below reads as "" when no repo Variable exists,
          # and syncDeals.js treats an empty/unset value as "use the code
          # default" (Number("") || fallback, "" || fallback, etc.) — so
          # nothing here changes behavior until you actually set a Variable
          # at Settings -> Secrets and variables -> Actions -> Variables tab.
          DISCOVERY_MODE: ${{ vars.DISCOVERY_MODE }}
          MIN_DEAL_DISCOUNT_PERCENT: ${{ vars.MIN_DEAL_DISCOUNT_PERCENT }}
          DEAL_DISCOVERY_LIMIT: ${{ vars.DEAL_DISCOVERY_LIMIT }}
          MIN_DEAL_RATING_STARS: ${{ vars.MIN_DEAL_RATING_STARS }}
          DEAL_BRAND_ALLOWLIST: ${{ vars.DEAL_BRAND_ALLOWLIST }}
          MIN_DEAL_REVIEW_COUNT: ${{ vars.MIN_DEAL_REVIEW_COUNT }}
          PRODUCT_FINDER_MAX_SALES_RANK: ${{ vars.PRODUCT_FINDER_MAX_SALES_RANK }}
          PRODUCT_FINDER_EXCLUDED_CATEGORY_IDS: ${{ vars.PRODUCT_FINDER_EXCLUDED_CATEGORY_IDS }}
          # Added 2026-08-22: caps how many raw candidates get pulled into
          # the per-ASIN check loop BEFORE it runs (as opposed to
          # DEAL_DISCOVERY_LIMIT, which only trims the final list AFTER
          # filtering). Defaults to DEAL_DISCOVERY_LIMIT * 4 if unset, which
          # is how a 413-candidate run happened once the brand allowlist
          # came off — each candidate costs a real Keepa call, so a big raw
          # pool directly costs wall-clock time. Recommend starting at 100
          # here and raising it once you've seen how long a real run takes.
          DEAL_DISCOVERY_RAW_POOL: ${{ vars.DEAL_DISCOVERY_RAW_POOL }}
