name: Sync Deals

# Runs scripts/syncDeals.js on a schedule so the site's Supabase `deals`
# table stays fresh without anyone running it by hand. Reuses the exact
# same Node script as local runs — no separate pipeline to maintain.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions
# -> New repository secret) — same names/values as your local .env.local:
#   KEEPA_API_KEY, AMAZON_AFFILIATE_TAG, LINKTWIN_API_KEY, VITE_SUPABASE_URL,
#   VITE_SUPABASE_SECRET_KEY, AMAZON_CREDENTIAL_ID, AMAZON_CREDENTIAL_SECRET,
#   AMAZON_CREDENTIAL_VERSION, AMAZON_MARKETPLACE
# Without these, syncDeals.js's own requireEnv() check fails fast with a
# clear "Missing required env vars" list in the run log — not a silent
# no-op.
#
# All other env vars the script reads (DISCOVERY_MODE, DEAL_DISCOVERY_LIMIT,
# MIN_DEAL_DISCOUNT_PERCENT, etc.) have safe defaults baked into the code —
# only add them below as repo Variables if you want to override a default
# without touching code.

# Cadence — revised 2026-08-25: briefly ran daily-at-midnight (one repo
# commit made directly on GitHub), which turned out to leave ~96% of this
# account's real Keepa token budget unused (20 tokens/min = ~1200/hour =
# ~28,800/day, but one run only spends ~1000-1050) — confirmed live via the
# account's own dashboard sitting at 1194/1200 tokens available. That was
# also why deal growth had stalled: far fewer candidate-check opportunities
# per day than the budget actually supports.
#
# A real run now confirmed to take ~1h05m end to end. Plain hourly ("0 * * *
# *") would leave negative margin — the next hour's trigger would fire
# before the current run finishes, every time, and just perpetually queue
# behind itself (harmless thanks to the concurrency guard below, but not
# useful). Cron can't express "every 80 minutes" as a single expression —
# it matches wall-clock fields (minute/hour), not raw intervals — so this
# uses three separate cron entries that together land exactly 80 minutes
# apart, repeating on a 4-hour cycle:
#   :00 at hours 0,4,8,12,16,20 | :20 at hours 1,5,9,13,17,21 | :40 at
#   hours 2,6,10,14,18,22
# → 00:00, 01:20, 02:40, 04:00, 05:20, 06:40, ... 22:40, then 00:00 again.
# 18 runs/day, each 80min apart — a 15min buffer over the ~65min run time,
# and ~18,900 tokens/day requested against the ~28,800/day the account
# earns (comfortable headroom, not maxed out).
on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *" # UTC
    - cron: "20 1,5,9,13,17,21 * * *" # UTC
    - cron: "40 2,6,10,14,18,22 * * *" # UTC
    # GitHub may delay a run slightly under load; scheduled workflows also
    # auto-disable after 60 days with zero commits to the repo (a GitHub
    # platform limit, not something this workflow controls) — a push
    # re-enables it.
  workflow_dispatch: {} # adds a manual "Run workflow" button in the Actions tab

# Added 2026-08-22: now that syncDeals.js paces requests to the account's
# real Keepa token budget (20/min on the current plan) rather than a fixed
# 1.2s, a run with a sizeable raw pool can genuinely take longer than the
# hourly cron interval. Without this, an hourly trigger firing while the
# previous run is still going would mean two runs sharing the same 20
# tokens/minute budget at once -- which is exactly the kind of thing that
# caused the 429 storm this was built to prevent. `group` scopes this to
# one in-flight run of this workflow at a time; cancel-in-progress is left
# false (the safe default) so a legitimately still-running sync is queued
# behind, never killed mid-way -- a run that's simply running long just
# pushes the next trigger later instead of overlapping it.
concurrency:
  group: sync-deals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Bumped 20 -> 35 -> 90 (2026-08-22): dedupeAsinsByVariantFamily() now
    # paces each request to this account's real Keepa budget (20 tokens/
    # min, confirmed on the account's own dashboard) rather than a fixed
    # 1.2s -- a full-fetch candidate (offers+stats, ~13 tokens) now takes
    # ~39s to stay within budget, not 1.2s. A raw pool sized to roughly
    # match one hour's worth of tokens (see DEAL_DISCOVERY_RAW_POOL below)
    # can still take most of an hour to fully process. 90 minutes gives
    # real headroom; the concurrency guard above means a long run just
    # delays the next trigger rather than causing an overlap.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync deals
        run: npm run sync-deals
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          LINKTWIN_API_KEY: ${{ secrets.LINKTWIN_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SECRET_KEY: ${{ secrets.VITE_SUPABASE_SECRET_KEY }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREDENTIAL_VERSION }}
          AMAZON_MARKETPLACE: ${{ secrets.AMAZON_MARKETPLACE }}
          # Optional tuning knobs (added 2026-08-21: previously listed here
          # but commented out, which meant setting any of these as a repo
          # Variable in the GitHub UI did NOTHING — the env line below has to
          # actually reference ${{ vars.X }} for a Variable to reach the
          # script at all. Now wired live. Each one is still safe to leave
          # unset: every var below reads as "" when no repo Variable exists,
          # and syncDeals.js treats an empty/unset value as "use the code
          # default" (Number("") || fallback, "" || fallback, etc.) — so
          # nothing here changes behavior until you actually set a Variable
          # at Settings -> Secrets and variables -> Actions -> Variables tab.
          DISCOVERY_MODE: ${{ vars.DISCOVERY_MODE }}
          MIN_DEAL_DISCOUNT_PERCENT: ${{ vars.MIN_DEAL_DISCOUNT_PERCENT }}
          DEAL_DISCOVERY_LIMIT: ${{ vars.DEAL_DISCOVERY_LIMIT }}
          MIN_DEAL_RATING_STARS: ${{ vars.MIN_DEAL_RATING_STARS }}
          DEAL_BRAND_ALLOWLIST: ${{ vars.DEAL_BRAND_ALLOWLIST }}
          MIN_DEAL_REVIEW_COUNT: ${{ vars.MIN_DEAL_REVIEW_COUNT }}
          PRODUCT_FINDER_MAX_SALES_RANK: ${{ vars.PRODUCT_FINDER_MAX_SALES_RANK }}
          PRODUCT_FINDER_EXCLUDED_CATEGORY_IDS: ${{ vars.PRODUCT_FINDER_EXCLUDED_CATEGORY_IDS }}
          # Added 2026-08-22, recalculated same day once the account's real
          # Keepa budget was confirmed (20 tokens/min, 1200 token cap): caps
          # how many raw candidates get pulled into the per-ASIN check loop
          # BEFORE it runs (as opposed to DEAL_DISCOVERY_LIMIT, which only
          # trims the final list AFTER filtering). Defaults to
          # DEAL_DISCOVERY_LIMIT * 4 if unset. Recommend setting this to
          # around 150: cheap-checking 150 candidates costs ~150 tokens: if
          # roughly half turn out to need a full fetch (13 tokens each),
          # that's another ~975 -- close to the ~1200 tokens this account
          # earns per hour, so one run's real Keepa cost roughly matches
          # what it earns back before the next one. Push this higher only
          # after upgrading the Keepa plan's token rate (see PLAN & USAGE
          # in Keepa's dashboard) -- raising it without more tokens/minute
          # just means a longer queue of 429s once the bucket runs dry.
          DEAL_DISCOVERY_RAW_POOL: ${{ vars.DEAL_DISCOVERY_RAW_POOL }}
          # Added 2026-08-25, both newly wired as repo Variables here for the
          # first time (previously code-only defaults):
          #
          # MAX_FULL_FETCH_CHECKS_PER_RUN — confirmed via live logs to be the
          # ACTUAL bottleneck on how many deals get published per run, not
          # DEAL_DISCOVERY_RAW_POOL (which already pulls in more candidates
          # than this cap lets through — logs consistently showed "60
          # deferred" out of 120). Code default raised 60 -> 75 (+15 items *
          # ~39s = +9.75min) — worst observed run time (65.7min) puts a run
          # around ~75.4min, leaving only ~4.6min of buffer under the 80min
          # sync cadence. Real but thin margin — watch actual run times
          # after this ships; if a run starts pushing past ~78-79min, drop
          # this back toward 70 right here as a Variable, no code change
          # needed. This is a wall-clock cost, unlike the knob below.
          MAX_FULL_FETCH_CHECKS_PER_RUN: ${{ vars.MAX_FULL_FETCH_CHECKS_PER_RUN }}
          # PRODUCT_FINDER_FETCH_POOL — how much of Keepa's match pool gets
          # pulled per Product Finder call (code default 500). Confirmed via
          # Keepa's own docs that Product Finder's token cost scales with
          # total MATCHES, not this number (10 tokens/request + 1 per 100
          # ASINs matched) — so raising it costs no extra tokens or time,
          # it just widens how much of the real match pool is available to
          # sample from each run (see PRODUCT_FINDER_FETCH_POOL's doc
          # comment in syncDeals.js for the full story on why that matters).
          # Only worth raising once PRODUCT_FINDER_MAX_SALES_RANK/
          # MIN_DEAL_REVIEW_COUNT are loosened enough that total matches
          # regularly exceed the current default.
          PRODUCT_FINDER_FETCH_POOL: ${{ vars.PRODUCT_FINDER_FETCH_POOL }}
